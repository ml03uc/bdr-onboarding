    // ─── Quiz Component ───────────────────────────────────────────────────────
    function QuizSection({ questions, moduleId }) {
      const [current, setCurrent] = useState(0);
      const [selected, setSelected] = useState(null);
      const [answered, setAnswered] = useState(false);
      const [score, setScore] = useState(0);
      const [done, setDone] = useState(false);
      const q = questions[current];
      function pick(idx) {
        if (answered) return;
        setSelected(idx);
        setAnswered(true);
        if (idx===q.correct) setScore(s=>s+1);
      }
      function next() {
        if (current+1>=questions.length) { setDone(true); }
        else { setCurrent(c=>c+1); setSelected(null); setAnswered(false); }
      }
      function restart() { setCurrent(0); setSelected(null); setAnswered(false); setScore(0); setDone(false); }
      if (done) {
        const pct = Math.round((score/questions.length)*100);
        return (
          <div className="bg-white rounded-2xl border border-slate-200 p-6 text-center slide-in">
            <div className="text-5xl mb-3">{pct===100?'🏆':pct>=67?'🎯':'📚'}</div>
            <p className="text-2xl font-black text-slate-800">{score} / {questions.length} correct</p>
            <p className="text-slate-500 mt-1">{pct===100?'Perfect score! You nailed it.':pct>=67?'Nice work! Review any missed questions.':'Keep reviewing this module and try again.'}</p>
            <button onClick={restart} className="mt-4 px-6 py-2 rounded-xl text-white font-bold text-sm" style={{backgroundColor:'#2B2D6B'}}>Try Again</button>
          </div>
        );
      }
      return (
        <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
          <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
            <div className="flex items-center gap-2"><span className="text-xl">🧠</span><span className="font-bold text-slate-800">Quick Check</span></div>
            <span className="text-sm text-slate-400">Question {current+1} of {questions.length}</span>
          </div>
          <div className="p-6 slide-in" key={current}>
            <p className="font-semibold text-slate-800 text-base leading-snug mb-5">{q.question}</p>
            <div className="flex flex-col gap-2">
              {q.options.map((opt,idx)=>{
                let cls='quiz-option border-2 border-slate-200 rounded-xl p-3 text-left text-sm text-slate-700';
                if (answered) {
                  if (idx===q.correct) cls+=' quiz-reveal';
                  else if (idx===selected&&idx!==q.correct) cls+=' quiz-wrong';
                }
                return (
                  <button key={idx} className={cls} onClick={()=>pick(idx)}>
                    <span className="font-bold mr-2 text-slate-400">{['A','B','C','D'][idx]}.</span>
                    {opt}
                    {answered&&idx===q.correct&&<span className="ml-2">✓</span>}
                    {answered&&idx===selected&&idx!==q.correct&&<span className="ml-2">✗</span>}
                  </button>
                );
              })}
            </div>
            {answered&&(
              <div className="mt-4 p-4 bg-blue-50 rounded-xl border border-blue-200 slide-in">
                <p className="text-sm font-semibold text-blue-800 mb-1">{selected===q.correct?'✅ Correct!':'❌ Not quite.'}</p>
                <p className="text-sm text-blue-700">{q.explanation}</p>
                <button onClick={next} className="mt-3 px-5 py-2 rounded-xl text-white font-bold text-sm" style={{backgroundColor:'#2B2D6B'}}>
                  {current+1<questions.length?'Next Question →':'See Results'}
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

              {psa:'QuickBooks Payments',signals:['"Pay now" link opens an Intuit / QuickBooks payment page','URL contains intuit.com or quickbooks','Simple pay-now form, re-enter details each time','No invoice history or Auto-Pay tied to engagements'],processor:'QuickBooks Payments',apStatus:'⚠️ Built-in checkout',opportunity:'Free ACH (vs their 1% ACH), card fee passed to the client, a real portal, Auto-Pay, and automation. Keep QuickBooks as the books.',color:'#15803d',portal:{bg:'#14532d',accent:'#15803d',text:'white',label:'Pay Invoice',url:'connect.intuit.com/pay',field1:'Card / Bank',field2:'Amount',btnColor:'#15803d',note:'Pay-now link only; no portal'}},
              {psa:'Canopy',signals:['"Client login" loads a *.canopytax.com portal','Modern tile/dashboard client portal','Optional billing module (not always on)','Sits on top of the firm\'s ledger'],processor:'Built-in or Stripe',apStatus:'⚠️ Works alongside',opportunity:'Workflow-first PM. Billing is secondary. AP becomes the payments + collections + reconciliation layer alongside it.',color:'#0284c7',portal:{bg:'#0c4a6e',accent:'#0284c7',text:'white',label:'Client Portal',url:'firmname.canopytax.com',field1:'Email',field2:'Password',btnColor:'#0284c7',note:'PM portal; billing optional module'}},
              {psa:'Ignition',signals:['"Accept proposal" / proposal links (ignitionapp.com)','Engagement-letter + upfront-payment flow','Recurring billing set at proposal time','No real collections or multi-ledger reconciliation'],processor:'Built-in card/ACH',apStatus:'⚠️ Works alongside / competitive',opportunity:'Keep Ignition for proposals. AP runs the ongoing receivable: free ACH, surcharging, Auto-Pay across the book, Collections Assist, reconciliation.',color:'#d97706',portal:{bg:'#78350f',accent:'#d97706',text:'white',label:'Proposal / Payment',url:'firmname.ignitionapp.com',field1:'Accept & Pay',field2:'Card / Bank',btnColor:'#d97706',note:'Proposal-led; processing fees exceed sub'}},
              {psa:'No Portal (Checks / Manual)',signals:['No "Pay my invoice" or "Client login" anywhere','Site says "mail checks to..." or lists an email for invoices','Contact-us-to-pay or no payment info at all','Likely client-initiated ACH and manual reconciliation'],processor:'Checks / manual ACH',apStatus:'🟢 Greenfield',opportunity:'Best opening: no incumbent. Lead with automation, free ACH, a real portal, Auto-Pay, and Collections Assist to slash DSO.',color:'#64748b',portal:{bg:'#334155',accent:'#64748b',text:'white',label:'(No payment portal found)',url:'firmname.com/contact',field1:'Mail check to...',field2:'or email us',btnColor:'#64748b',note:'No portal = strong greenfield signal'}},
            ].map(p=>(
              <div key={p.psa} className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                <div className="flex items-center gap-4 p-4 border-b border-slate-100" style={{backgroundColor:p.color+'15'}}>
                  <div className="w-10 h-10 rounded-xl flex items-center justify-center text-white font-black text-sm" style={{backgroundColor:p.color}}>{p.psa[0]}</div>
                  <div className="flex-1"><p className="font-black text-slate-800">{p.psa}</p><p className="text-xs text-slate-500">Likely processor: <strong>{p.processor}</strong></p></div>
                  {p.apStatus && <span className={`text-xs font-bold px-2 py-1 rounded-lg flex-shrink-0 ${p.apStatus.startsWith('🟢')?'bg-green-100 text-green-800':'bg-amber-100 text-amber-800'}`}>{p.apStatus}</span>}
                </div>
                <div className="p-4 grid md:grid-cols-3 gap-4">
                  <div>
                    <p className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">How to recognize it</p>
                    <ul className="space-y-1">{p.signals.map(s=>(<li key={s} className="flex gap-2 text-xs text-slate-600"><span className="text-slate-400 flex-shrink-0">•</span>{s}</li>))}</ul>
                  </div>
                  <div style={{backgroundColor:p.portal.bg,borderRadius:'12px',padding:'14px',minHeight:'140px'}}>
                    <p className="text-xs font-bold mb-2 opacity-70" style={{color:p.portal.text}}>{p.portal.label}</p>
                    <p className="text-xs mb-3 opacity-50 font-mono" style={{color:p.portal.text,fontSize:'9px'}}>{p.portal.url}</p>
                    <div className="space-y-1.5">
                      <div style={{backgroundColor:'rgba(255,255,255,0.15)',borderRadius:'6px',padding:'5px 8px'}}><p style={{color:p.portal.text,opacity:0.6,fontSize:'9px'}}>{p.portal.field1}</p></div>
                      <div style={{backgroundColor:'rgba(255,255,255,0.15)',borderRadius:'6px',padding:'5px 8px'}}><p style={{color:p.portal.text,opacity:0.6,fontSize:'9px'}}>{p.portal.field2}</p></div>
                      <div style={{backgroundColor:p.portal.btnColor,borderRadius:'6px',padding:'5px 8px',textAlign:'center',marginTop:'6px'}}><p style={{color:'white',fontSize:'9px',fontWeight:'bold'}}>Continue</p></div>
                    </div>
                    <p className="mt-2 opacity-50" style={{color:p.portal.text,fontSize:'8px',lineHeight:'1.3'}}>{p.portal.note}</p>
                  </div>
                  <div className="bg-teal-50 rounded-xl p-3"><p className="text-xs font-bold text-teal-700 uppercase tracking-wide mb-1">AP Opportunity</p><p className="text-xs text-teal-600 leading-relaxed">{p.opportunity}</p></div>
                </div>
              </div>
            ))}
          </div>
          <QuizSection questions={QUIZZES['acct-spot-stack']} moduleId="acct-spot-stack"/>
        </div>
      );
      if (moduleId==='acct-competitive') return <AcctCompetitivePlaybook/>;
      if (moduleId==='acct-knowledge-base') return <AcctKnowledgeBase/>;
      return null;
    }
    // ─── Home Screen ──────────────────────────────────────────────────────────
    function HomeScreen({ onSelect, vertical, modules }) {
      const isAcct = vertical==='accounting';
      return (
        <div className="space-y-6 slide-in">
          <div className={`${isAcct?'gradient-header-acct':'gradient-header'} rounded-2xl p-8 text-white`} style={{borderRadius:'12px'}}>
            <div className="flex items-center gap-3 mb-4"><span style={{color:'#C5A338'}} className="font-semibold">Alternative Payments</span></div>
            <h1 className="text-3xl font-black leading-tight mb-3">{isAcct ? <>Accounting Firm Landscape<br/>Onboarding Guide</> : <>MSP Landscape<br/>Onboarding Guide</>}</h1>
            <p style={{color:'rgba(255,255,255,0.85)'}} className="leading-relaxed max-w-lg">{isAcct ? 'Everything you need to understand the accounting-firm market, speak the language, and sell the firm-led AR standard with confidence. Work through each module at your own pace.' : 'Everything you need to understand the MSP market, speak the language, and sell with confidence. Work through each module at your own pace.'}</p>
            <div className="mt-5 flex flex-wrap gap-3">
              <div className="rounded-lg px-4 py-2 text-sm font-semibold" style={{backgroundColor:'rgba(255,255,255,0.12)',borderRadius:'8px'}}>{modules.length} Modules</div>
              <div className="rounded-lg px-4 py-2 text-sm font-semibold" style={{backgroundColor:'rgba(255,255,255,0.12)',borderRadius:'8px'}}>Interactive visuals</div>
              <div className="rounded-lg px-4 py-2 text-sm font-semibold" style={{backgroundColor:'rgba(255,255,255,0.12)',borderRadius:'8px'}}>Quizzes included</div>
            </div>
          </div>
          <div className="grid md:grid-cols-2 gap-4">
            {modules.map(m=>(
              <button key={m.id} onClick={()=>onSelect(m.id)} className="module-card bg-white p-5 text-left" style={{border:'1px solid #E2E8F0',boxShadow:'var(--ap-shadow-flat)'}}>
                <div className="flex items-start gap-4">
                  <div className="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl flex-shrink-0" style={{backgroundColor:m.color+'20'}}>{m.icon}</div>
                  <div className="flex-1">
                    <p className="font-bold text-base" style={{color:'#2B2D42'}}>{m.title}</p>
                    <p className="text-sm mt-1 leading-snug" style={{color:'#94A3B8'}}>{m.desc}</p>
                    <p className="text-xs font-semibold mt-2" style={{color:m.color}}>{m.time} read</p>
                  </div>
                  <span className="text-slate-300 text-xl mt-1">→</span>
                </div>
              </button>
            ))}
          </div>
        </div>
      );
    }
    // ─── Main App ─────────────────────────────────────────────────────────────
    function App() {
      const [vertical, setVertical] = useState('msp');
      const [active, setActive] = useState('home');
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const isAcct = vertical==='accounting';
      const modules = isAcct ? ACCT_MODULES : MODULES;
      const current = modules.find(m=>m.id===active);
      const accent = isAcct ? '#0d9488' : '#2B2D6B';
      function switchVertical(v) { if (v===vertical) return; setVertical(v); setActive('home'); setSidebarOpen(false); }
      return (
        <div className="min-h-screen flex flex-col" style={{backgroundColor:'#F8FAFC'}}>
          <nav className="sticky top-0 z-50 bg-white border-b shadow-sm" style={{borderColor:'#E2E8F0',boxShadow:'var(--ap-shadow-sticky)'}}>
            <div className="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between gap-3">
              <div className="flex items-center gap-3 min-w-0">
                <button onClick={()=>setSidebarOpen(!sidebarOpen)} className="md:hidden p-2 rounded-lg text-slate-500 hover:bg-slate-100">☰</button>
                <button onClick={()=>setActive('home')} className="flex items-center gap-3">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 40" style={{height:'28px'}}>
                    <text x="0" y="30" fontFamily="Inter, -apple-system, BlinkMacSystemFont, sans-serif" fontSize="24" fontWeight="700" fill="#2B2D42">alternative</text>
                    <text x="158" y="30" fontFamily="Inter, -apple-system, BlinkMacSystemFont, sans-serif" fontSize="24" fontWeight="400" fill="#2B2D42">payments</text>
                  </svg>
                  <span className="text-xs font-bold px-2 py-0.5 rounded-full hidden sm:block" style={{backgroundColor:isAcct?'#ECFDF5':'#F3EEFF',color:accent}}>{isAcct?'Accounting Guide':'MSP Guide'}</span>
                </button>
                {active!=='home'&&current&&(<><span className="text-slate-300 hidden md:block">/</span><span className="text-slate-600 text-sm font-semibold hidden md:block truncate">{current.title}</span></>)}
              </div>
              <div className="flex items-center gap-2 flex-shrink-0">
                <div className="flex items-center gap-1 bg-slate-100 rounded-xl p-1">
                  <button onClick={()=>switchVertical('msp')} className="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all" style={!isAcct?{backgroundColor:'#2B2D6B',color:'white'}:{color:'#64748b'}}>MSPs</button>
                  <button onClick={()=>switchVertical('accounting')} className="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all" style={isAcct?{backgroundColor:'#0d9488',color:'white'}:{color:'#64748b'}}>Accounting</button>
                </div>
                <button onClick={()=>setActive('home')} className="hidden sm:block text-sm font-semibold px-4 py-1.5 rounded-lg transition-all text-slate-500 hover:text-slate-800">All Modules</button>
              </div>
            </div>
          </nav>
          <div className="flex flex-1 max-w-7xl mx-auto w-full">
            <aside className={`${sidebarOpen?'block':'hidden'} md:block w-64 flex-shrink-0 bg-white`} style={{position:'sticky',top:'56px',height:'calc(100vh - 56px)',overflowY:'auto',borderRight:'1px solid #E2E8F0'}}>
              <div className="p-4">
                <div className="flex items-center gap-1 bg-slate-100 rounded-xl p-1 mb-4 md:hidden">
                  <button onClick={()=>switchVertical('msp')} className="flex-1 px-3 py-1.5 rounded-lg text-sm font-bold transition-all" style={!isAcct?{backgroundColor:'#2B2D6B',color:'white'}:{color:'#64748b'}}>MSPs</button>
                  <button onClick={()=>switchVertical('accounting')} className="flex-1 px-3 py-1.5 rounded-lg text-sm font-bold transition-all" style={isAcct?{backgroundColor:'#0d9488',color:'white'}:{color:'#64748b'}}>Accounting</button>
                </div>
                <button onClick={()=>{setActive('home');setSidebarOpen(false)}} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold transition-all mb-1 ${active==='home'?'nav-item-active':'text-slate-600 hover:bg-slate-100'}`}><span>🏠</span> Home</button>
                <div className="mt-2 mb-1 px-3"><p className="text-xs font-bold text-slate-400 uppercase tracking-widest">{isAcct?'Accounting Modules':'MSP Modules'}</p></div>
                {modules.map(m=>(
                  <button key={m.id} onClick={()=>{setActive(m.id);setSidebarOpen(false)}} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold transition-all mb-0.5 ${active===m.id?'nav-item-active':'text-slate-600 hover:bg-slate-100'}`}><span>{m.icon}</span><span className="truncate">{m.title}</span></button>
                ))}
              </div>
            </aside>
            <main className="flex-1 p-4 md:p-6 overflow-x-hidden">
              {active==='home'
                ? <HomeScreen onSelect={(id)=>setActive(id)} vertical={vertical} modules={modules}/>
                : (isAcct ? <AcctModuleContent moduleId={active}/> : <ModuleContent moduleId={active}/>)
              }
            </main>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
