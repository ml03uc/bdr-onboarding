<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MSP Guide | Alternative Payments</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ap: { navy: '#2B2D42', blue: '#2B2D6B', light: '#7C5CFC', slate: '#3D3F56', gold: '#C5A338' }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --ap-navy:#2B2D42; --ap-blue:#2B2D6B; --ap-light:#7C5CFC; --ap-slate:#3D3F56;
      --ap-brand-gold:#C5A338; --ap-surface:#F8FAFC; --ap-surface-100:#F1F5F9;
      --ap-border:#E2E8F0; --ap-text-body:#334155; --ap-text-muted:#94A3B8;
      --ap-shadow-flat: 0px 1px 2px 0px rgba(36, 104, 147, 0.04);
      --ap-shadow-overlay: 0px 4px 4px -1px rgba(36, 104, 147, 0.04);
      --ap-shadow-sticky: 0px 4px 8px 0px rgba(36, 104, 147, 0.04);
    }
    * { box-sizing: border-box; }
    body { background-color:#F8FAFC; color:#334155; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; margin:0; }
    .module-card { transition: transform 0.2s ease, box-shadow 0.2s ease; border-radius: 12px; }
    .module-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(36,104,147,0.08); }
    .quiz-option { transition: all 0.15s ease; cursor: pointer; }
    .quiz-option:hover { border-color:#2B2D6B!important; background-color:#F3EEFF!important; }
    .quiz-correct { border-color:#10B981!important; background-color:#ECFDF5!important; }
    .quiz-wrong { border-color:#EF4444!important; background-color:#FEF2F2!important; }
    .quiz-reveal { border-color:#10B981!important; background-color:#D1FAE5!important; }
    @keyframes slideIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .slide-in { animation: slideIn 0.3s ease forwards; }
    .progress-bar { transition: width 0.4s ease; }
    .nav-item-active { background: linear-gradient(135deg,#2B2D6B,#3D3F56); color: white; }
    .gradient-header { background: linear-gradient(135deg,#2B2D42 0%,#2B2D6B 60%,#7C5CFC 100%); }
    .ecosystem-node { transition: all 0.2s ease; }
    .ecosystem-node:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(43,45,107,0.25); }
    .flow-node { transition: all 0.25s ease; }
    .flow-node:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(36,104,147,0.12); }
    .flow-node-active { ring: 2px solid #2B2D6B; box-shadow: 0 0 0 3px rgba(43,45,107,0.25); }
    .integration-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;
    // ─── Quiz Data ────────────────────────────────────────────────────────────
    const QUIZZES = {
      'what-is-msp': [
        {
          question: "An MSP (Managed Service Provider) is best described as...",
          options: [
            "A company that sells laptops and hardware to businesses",
            "A company that manages IT infrastructure and services for other businesses on an ongoing basis",
            "A software company that builds accounting tools",
            "A payment processor for technology companies"
          ],
          correct: 1,
          explanation: "MSPs deliver ongoing IT services like monitoring, cloud storage, help desk, and security for businesses that don't want to manage IT in-house."
        },
        {
          question: "How many MSPs are estimated to exist in the USA?",
          options: ["About 5,000", "About 40,000", "About 150,000", "About 1 million"],
          correct: 1,
          explanation: "MSP Resources reports approximately 40,000 MSPs in the USA, while 150,000 exist globally."
        },
        {
          question: "What is our Ideal Customer Profile (ICP)?",
          options: [
            "Enterprise MSPs with 500+ employees and $100M+ in revenue",
            "MSPs doing $1–$20M in annual revenue with 5–100 employees",
            "Solo freelance IT consultants",
            "SaaS companies that serve MSPs"
          ],
          correct: 1,
          explanation: "Our sweet spot is MSPs with $1–$20M in annual revenue. The CEO is usually directly aware of payment strategy, and they face the pain points we solve."
        }
      ],
      'tech-stack': [
        {
          question: "What does PSA stand for?",
          options: ["Payment Services Application","Professional Services Automation","Partner Software Arrangement","Platform Security Access"],
          correct: 1,
          explanation: "PSA = Professional Services Automation. It's the operational backbone of an MSP that handles tickets, billing, contracts, and time tracking."
        },
        {
          question: "Why does Alternative Payments only need to integrate into the PSA (not the RMM)?",
          options: [
            "Because RMMs are too complex to integrate with",
            "Because PSAs are what handle the billing side of an MSP's business",
            "Because RMMs are usually owned by different companies",
            "Because Alternative Payments is already built into all RMMs"
          ],
          correct: 1,
          explanation: "The PSA is where invoices are created, contracts are managed, and billing happens. The RMM is for monitoring and remote management. AP only needs to plug into billing."
        },
        {
          question: "Which of these tools does an MSP use to track expenses, run payroll, and file taxes?",
          options: ["The PSA","The RMM","Accounting Software (like QuickBooks)","The AP Platform"],
          correct: 2,
          explanation: "Accounting software like QuickBooks handles the financial side: payroll, expenses, taxes, and compliance. The PSA handles the operations side."
        }
      ],
      'psa-platforms': [
        {
          question: "Which PSA is considered a strategic win for AP because it's the only payment processor they officially integrate with?",
          options: ["ConnectWise","Autotask","SyncroMSP","HaloPSA"],
          correct: 3,
          explanation: "HaloPSA's only MSP payment processor integration is Alternative Payments. Since Halo is growing fast and taking market share, this is a huge opportunity."
        },
        {
          question: "ConnectBooster is owned by which company, and why does that matter to us?",
          options: [
            "ConnectWise: MSPs using ConnectWise love it",
            "Kaseya: MSPs dislike Kaseya, making them open to switching",
            "Alternative Payments: it's our own product",
            "QuickBooks: it's a financial product"
          ],
          correct: 1,
          explanation: "Kaseya owns ConnectBooster. Because MSPs widely dislike Kaseya (known for aggressive acquisitions and price hikes), ConnectBooster customers are often open to exploring alternatives."
        },
        {
          question: "Which tool would you use to connect ConnectWise to QuickBooks?",
          options: ["ConnectBooster","WisePay","WiseSync","FlexPoint"],
          correct: 2,
          explanation: "ConnectWise requires a separate tool called WiseSync to sync data with QuickBooks. AP doesn't need WiseSync because AP integrates directly with both."
        }
      ],
      'money-flow': [
        {
          question: "In a traditional MSP billing workflow WITHOUT AP, what is the most painful manual step?",
          options: [
            "Creating the invoice in the PSA",
            "Sending the invoice and chasing payment manually, then reconciling across systems",
            "Logging into QuickBooks",
            "Setting up service agreements"
          ],
          correct: 1,
          explanation: "Without AP, MSPs manually send invoices (often as PDFs via email), chase late payments, then manually reconcile payment data across their PSA and accounting software. AP automates all of this."
        },
        {
          question: "What does AP's dual integration mean for an MSP?",
          options: [
            "AP integrates with two different payment networks (Visa and Mastercard)",
            "AP connects to both the PSA and the accounting software simultaneously, updating both in real time when payment is made",
            "AP offers two pricing tiers",
            "AP works with both ConnectWise and Autotask"
          ],
          correct: 1,
          explanation: "Dual integration = AP connects to the PSA (like ConnectWise) AND the accounting software (like QuickBooks) at the same time. When a customer pays, both systems update automatically. No manual reconciliation needed."
        }
      ],
      'invoicing-flow': [
        {
          question: "In the MSP revenue flow, every invoice starts with...",
          options: [
            "A payment link sent by AP",
            "A ticket created in the PSA",
            "A QuickBooks entry",
            "An email from the client"
          ],
          correct: 1,
          explanation: "Every invoice in an MSP starts with a ticket in the PSA. The ticket syncs to the accounting system or ERP, and the invoice is created from there."
        },
        {
          question: "What are the three types of MSP invoicing?",
          options: [
            "Daily, weekly, monthly",
            "Quoting tools, Projects/ad-hoc, Recurring",
            "ACH, credit card, check",
            "PSA, RMM, Accounting"
          ],
          correct: 1,
          explanation: "MSP invoicing branches into three types: Quoting tools (for CPQ/proposals), Projects/ad-hoc (one-time or break-fix), and Recurring (monthly managed services that scale)."
        },
        {
          question: "When can AP replace WiseSync or Gozynta/Mobius?",
          options: [
            "Always: AP replaces all sync tool functionality",
            "Never: sync tools serve a completely different purpose",
            "Only when the MSP uses the sync tool solely for payments and invoicing (not procurement, expenses, or inventory)",
            "Only for HaloPSA users"
          ],
          correct: 2,
          explanation: "AP can replace sync tools like WiseSync or Gozynta/Mobius IF the MSP only uses them for payment and invoice syncing. If they also use them for procurement, expenses, or product inventory, the MSP should keep the sync tool for those workflows."
        },
        {
          question: "What is the correct term for the MSP's customer in AP language?",
          options: [
            "Partner",
            "User",
            "Client (the MSP's end-client)",
            "Customer"
          ],
          correct: 2,
          explanation: "In AP language: Partner = the MSP, Client = the MSP's end-client. The Admin/Partner Dashboard is the MSP's view, and the Client Portal is the end-client's payment view."
        }
      ],
      'msp-culture': [
        {
          question: "MSPs rely heavily on which of the following when making purchasing decisions?",
          options: [
            "Vendor marketing materials and cold emails",
            "Peer groups, word of mouth, and social proof from other MSPs",
            "Government technology mandates",
            "What large enterprises are doing"
          ],
          correct: 1,
          explanation: "MSP communities are tight-knit. Tech Tribe, Lyra/Evergreen, and Reddit groups heavily influence purchasing. If one MSP loves AP, others in their peer group will follow."
        },
        {
          question: "Why do many MSPs dislike Kaseya?",
          options: [
            "Kaseya's products have poor uptime",
            "Kaseya charges too little, making them seem low-quality",
            "Kaseya has a reputation for acquiring beloved tools, then raising prices, extending contracts, and reducing support",
            "Kaseya only works with enterprise MSPs"
          ],
          correct: 2,
          explanation: "MSPs had tools they loved (Autotask, ConnectBooster) and then Kaseya bought them. This typically leads to price increases, long-term contracts, and reduced support. MSPs see AP as the underdog alternative they're rooting for."
        }
      ],
      'spot-psa': [
        {
          question: "The fastest way to identify which PSA an MSP uses is to...",
          options: [
            "Ask them directly on the first cold call",
            "Look at their LinkedIn page",
            "Click the 'Support' button on their website, which usually opens their PSA client portal",
            "Check their job postings for PSA software names"
          ],
          correct: 2,
          explanation: "When MSPs set up a support portal for their clients, it's powered by their PSA. Clicking 'Support' on their website usually loads a login page that reveals which PSA they use. The URL is the biggest giveaway."
        },
        {
          question: "If you see a login URL containing 'autotask.net', which PSA is the MSP using?",
          options: ["ConnectWise","HaloPSA","SyncroMSP","Autotask (owned by Kaseya)"],
          correct: 3,
          explanation: "Autotask portals load from autotask.net. Autotask was acquired by Kaseya in 2022 (previously owned by Datto, which acquired Autotask in 2017). So Autotask customers are Kaseya customers, and often open to switching payment processors."
        },
        {
          question: "You visit an MSP's website and see a CloudRadial client portal. What should you assume about their payment processor?",
          options: [
            "They use WisePay: CloudRadial integrates with ConnectWise",
            "They use Stripe: CloudRadial is a modern platform",
            "They most likely use ConnectBooster, since CloudRadial MSPs commonly pair it with ConnectBooster",
            "There's no way to know: CloudRadial doesn't indicate anything"
          ],
          correct: 2,
          explanation: "CloudRadial is a client management platform (not a PSA), but MSPs using it are most likely to have ConnectBooster for payments. It's a warm signal. Dig deeper to confirm, but ConnectBooster is your best first assumption."
        },
        {
          question: "Kaseya BMS is best described as...",
          options: [
            "Kaseya's RMM tool: manages remote devices",
            "Kaseya's native PSA: less common than Autotask, same Kaseya ecosystem",
            "A standalone billing platform owned by Kaseya",
            "ConnectWise's backup PSA product"
          ],
          correct: 1,
          explanation: "Kaseya BMS is Kaseya's native PSA. It's less common than Autotask but operates the same way. ConnectBooster is the default payment tool, and MSPs using it are inside the Kaseya ecosystem. The same pitch applies: they're likely frustrated with Kaseya and open to alternatives."
        }
      ]
    };
    // ─── Ecosystem Diagram ────────────────────────────────────────────────────
    function EcosystemDiagram() {
      const [active, setActive] = useState(null);
      const nodeInfo = {
        psa:        { label:'PSA',         sub:'ConnectWise · Halo · Autotask',  color:'#3D3F56', integrated:true,  desc:'The operational brain. Manages tickets, service agreements, invoices, and time tracking. This is where billing lives.' },
        ap:         { label:'AP Platform', sub:'Alternative Payments',           color:'#2B2D6B', integrated:true,  desc:'The missing link. AP connects to BOTH the PSA and accounting software simultaneously. When a client pays, both systems update in real time, zero manual work.' },
        accounting: { label:'Accounting',  sub:'QuickBooks · Xero',              color:'#059669', integrated:true,  desc:'Tracks money in and out. Handles payroll, taxes, and financial statements. Receives real-time payment updates directly from AP.' },
        rmm:        { label:'RMM',         sub:'Remote Monitoring',              color:'#64748b', integrated:false, desc:"Monitors client devices and servers remotely. Not billing-related. AP doesn't integrate here. The RMM sits outside the payment workflow entirely." },
        client:     { label:'MSP Client',  sub:'End Customer',                   color:'#7c3aed', integrated:true,  desc:'The business that pays the MSP. They receive a branded AP invoice with a payment link. One click to pay. AP handles all the reconciliation.' },
      };
      const rects = {
        psa:        { x:30,  y:168, w:162, h:72 },
        ap:         { x:309, y:168, w:162, h:72 },
        accounting: { x:588, y:168, w:162, h:72 },
        rmm:        { x:309, y:42,  w:162, h:68 },
        client:     { x:309, y:318, w:162, h:68 },
      };
      const connections = [
        { x1:192, y1:204, x2:309, y2:204, color:'#2B2D6B', dashed:false, label:'invoice sync',    lx:251, ly:194 },
        { x1:471, y1:204, x2:588, y2:204, color:'#059669', dashed:false, label:'payment sync',    lx:530, ly:194 },
        { x1:390, y1:110, x2:390, y2:168, color:'#94a3b8', dashed:true,  label:'no integration', lx:445, ly:143 },
        { x1:390, y1:240, x2:390, y2:318, color:'#7c3aed', dashed:false, label:'payment link',   lx:445, ly:282 },
      ];
      const markerFor = c => c.color==='#2B2D6B'?'arr-blue':c.color==='#059669'?'arr-green':c.color==='#7c3aed'?'arr-purple':'arr-gray';
      const activeInfo = active ? nodeInfo[active] : null;
      return (
        <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
          <div className="px-6 py-4" style={{background:'linear-gradient(135deg,#2B2D42,#3D3F56,#2B2D6B)'}}>
            <h3 className="text-white font-bold text-lg">The MSP Tech Ecosystem</h3>
            <p className="text-blue-200 text-sm mt-1">Click any node to learn more about its role</p>
          </div>
          <div className="p-4">
            <svg viewBox="0 0 780 410" style={{width:'100%',height:'auto',display:'block'}}>
              <defs>
                {[['arr-blue','#2B2D6B'],['arr-green','#059669'],['arr-purple','#7c3aed'],['arr-gray','#94a3b8']].map(([id,fill])=>(
                  <marker key={id} id={id} viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M0,0 L10,5 L0,10 z" fill={fill} opacity="0.85"/>
                  </marker>
                ))}
              </defs>
              {connections.map((c,i)=>(
                <g key={i}>
                  <line x1={c.x1} y1={c.y1} x2={c.x2} y2={c.y2}
                    stroke={c.color} strokeWidth={c.dashed?1.5:2.5}
                    strokeDasharray={c.dashed?'6,4':undefined}
                    opacity={0.8} markerEnd={`url(#${markerFor(c)})`}/>
                  <text x={c.lx} y={c.ly} textAnchor="middle"
                    fill={c.color} fontSize="10" fontWeight="600"
                    fontFamily="system-ui,sans-serif" opacity="0.9">{c.label}</text>
                </g>
              ))}
              {Object.keys(rects).map(id=>{
                const r = rects[id];
                const info = nodeInfo[id];
                const isActive = active===id;
                const midX = r.x+r.w/2;
                return (
                  <g key={id} onClick={()=>setActive(active===id?null:id)} style={{cursor:'pointer'}}>
                    <rect x={r.x+4} y={r.y+4} width={r.w} height={r.h} rx="13" fill="rgba(0,0,0,0.13)"/>
                    <rect x={r.x} y={r.y} width={r.w} height={r.h} rx="13"
                      fill={info.color}
                      stroke={isActive?'#93c5fd':'rgba(255,255,255,0.18)'}
                      strokeWidth={isActive?3:1}/>
                    {isActive&&<rect x={r.x-4} y={r.y-4} width={r.w+8} height={r.h+8} rx="17" fill="none" stroke="#bfdbfe" strokeWidth="1.5" opacity="0.7"/>}
                    <text x={midX} y={r.y+r.h/2-8} textAnchor="middle"
                      fill="white" fontSize={id==='ap'?'14.5':'13.5'} fontWeight="700"
                      fontFamily="system-ui,-apple-system,sans-serif">{info.label}</text>
                    <text x={midX} y={r.y+r.h/2+13} textAnchor="middle"
                      fill="rgba(255,255,255,0.7)" fontSize="9.5"
                      fontFamily="system-ui,-apple-system,sans-serif">{info.sub}</text>
                    {(id==='psa'||id==='accounting')&&(
                      <text x={midX} y={r.y+r.h+17} textAnchor="middle"
                        fill="#2B2D6B" fontSize="9" fontStyle="italic"
                        fontFamily="system-ui,sans-serif" opacity="0.85">AP integrates here ↑</text>
                    )}
                  </g>
                );
              })}
            </svg>
            <div className="flex flex-wrap gap-5 mt-1 mb-3 px-1">
              <div className="flex items-center gap-1.5 text-xs text-slate-500">
                <svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#2B2D6B" strokeWidth="2"/></svg>
                Integrated
              </div>
              <div className="flex items-center gap-1.5 text-xs text-slate-500">
                <svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#94a3b8" strokeWidth="1.5" strokeDasharray="5,3"/></svg>
                Not integrated
              </div>
            </div>
            {activeInfo&&(
              <div className="p-4 rounded-xl border-2 border-blue-100 bg-blue-50 slide-in">
                <div className="flex items-center gap-2 mb-2">
                  <div className="w-3 h-3 rounded-full flex-shrink-0" style={{backgroundColor:nodeInfo[active].color}}/>
                  <p className="font-bold text-slate-800">{activeInfo.label}</p>
                  <button onClick={()=>setActive(null)} className="ml-auto text-slate-400 text-xs hover:text-slate-600 px-2 py-0.5 rounded hover:bg-slate-200">✕ close</button>
                </div>
                <p className="text-slate-600 text-sm leading-relaxed">{activeInfo.desc}</p>
                {!activeInfo.integrated&&(
                  <p className="mt-2 text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-3 py-1.5">⚠️ AP does not integrate with this system</p>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }
    // ─── Invoice Flow ─────────────────────────────────────────────────────────
    function InvoiceFlow({ mode }) {
      const traditional = [
        { icon:'📄', label:'Create invoice', sub:'in PSA', color:'#3D3F56' },
        { icon:'📧', label:'Manually email', sub:'PDF invoice', color:'#374151' },
        { icon:'⏳', label:'Wait and chase', sub:'late payments', color:'#dc2626' },
        { icon:'🖩', label:'Manually sync', sub:'to accounting', color:'#d97706' },
        { icon:'🔍', label:'Reconcile', sub:'errors manually', color:'#7c3aed' },
      ];
      const withAP = [
        { icon:'📄', label:'Create invoice', sub:'in PSA', color:'#3D3F56' },
        { icon:'🔗', label:'AP link in email', sub:'sent automatically', color:'#2B2D6B' },
        { icon:'💳', label:'Client pays online', sub:'card, ACH, any method', color:'#059669' },
        { icon:'⚡', label:'PSA updates', sub:'automatically', color:'#059669' },
        { icon:'✅', label:'QuickBooks synced', sub:'zero manual work', color:'#059669' },
      ];
      const steps = mode==='traditional'?traditional:withAP;
      return (
        <div className={`rounded-2xl border-2 p-5 ${mode==='traditional'?'border-red-200 bg-red-50':'border-green-200 bg-green-50'}`}>
          <p className={`font-bold text-sm mb-4 ${mode==='traditional'?'text-red-700':'text-green-700'}`}>
            {mode==='traditional'?'❌ Traditional (manual & painful)':'✅ With Alternative Payments (automated)'}
          </p>
          <div className="flex flex-wrap items-center gap-2">
            {steps.map((step,i)=>(
              <div key={i} className="flex items-center gap-2">
                <div className="flex flex-col items-center text-center">
                  <div className="w-14 h-14 rounded-full flex items-center justify-center text-2xl shadow-sm bg-white border-2" style={{borderColor:step.color}}>{step.icon}</div>
                  <p className="text-xs font-semibold mt-1 text-slate-700 w-16 leading-tight">{step.label}</p>
                  <p className="text-xs text-slate-500 w-16 leading-tight">{step.sub}</p>
                </div>
                {i<steps.length-1&&<span className={`text-xl font-bold flex-shrink-0 ${mode==='traditional'?'text-red-400':'text-green-500'}`}>→</span>}
              </div>
            ))}
          </div>
        </div>
      );
    }
    // ─── PSA Card ─────────────────────────────────────────────────────────────
    function PSACard({ name, owner, processor, notes, color, apIntegration, isExpanded, onClick }) {
      const hasIntegration = apIntegration && apIntegration.startsWith('✅');
      const noIntegration = apIntegration && apIntegration.startsWith('❌');
      return (
        <button onClick={onClick} className="w-full text-left rounded-2xl border-2 overflow-hidden transition-all duration-200" style={{borderColor:isExpanded?color:'#e2e8f0'}}>
          <div className="flex items-center gap-4 p-4" style={{backgroundColor:isExpanded?color:'#f8fafc'}}>
            <div className="w-10 h-10 rounded-xl flex items-center justify-center text-white font-black text-lg flex-shrink-0" style={{backgroundColor:color}}>{name[0]}</div>
            <div className="flex-1">
              <p className={`font-bold ${isExpanded?'text-white':'text-slate-800'}`}>{name}</p>
              <p className={`text-xs ${isExpanded?'text-white opacity-80':'text-slate-500'}`}>Owned by {owner}</p>

    // ─── Quiz Component ───────────────────────────────────────────────────────
    function QuizSection({ questions, moduleId }) {
      const [current, setCurrent] = useState(0);
      const [selected, setSelected] = useState(null);
      const [answered, setAnswered] = useState(false);
      const [score, setScore] = useState(0);
      const [done, setDone] = useState(false);
      const q = questions[current];
      function pick(idx) {
        if (answered) return;
        setSelected(idx);
        setAnswered(true);
        if (idx===q.correct) setScore(s=>s+1);
      }
      function next() {
        if (current+1>=questions.length) { setDone(true); }
        else { setCurrent(c=>c+1); setSelected(null); setAnswered(false); }
      }
      function restart() { setCurrent(0); setSelected(null); setAnswered(false); setScore(0); setDone(false); }
      if (done) {
        const pct = Math.round((score/questions.length)*100);
        return (
          <div className="bg-white rounded-2xl border border-slate-200 p-6 text-center slide-in">
            <div className="text-5xl mb-3">{pct===100?'🏆':pct>=67?'🎯':'📚'}</div>
            <p className="text-2xl font-black text-slate-800">{score} / {questions.length} correct</p>
            <p className="text-slate-500 mt-1">{pct===100?'Perfect score! You nailed it.':pct>=67?'Nice work! Review any missed questions.':'Keep reviewing this module and try again.'}</p>
            <button onClick={restart} className="mt-4 px-6 py-2 rounded-xl text-white font-bold text-sm" style={{backgroundColor:'#2B2D6B'}}>Try Again</button>
          </div>
        );
      }
      return (
        <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
          <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
            <div className="flex items-center gap-2"><span className="text-xl">🧠</span><span className="font-bold text-slate-800">Quick Check</span></div>
            <span className="text-sm text-slate-400">Question {current+1} of {questions.length}</span>
          </div>
          <div className="p-6 slide-in" key={current}>
            <p className="font-semibold text-slate-800 text-base leading-snug mb-5">{q.question}</p>
            <div className="flex flex-col gap-2">
              {q.options.map((opt,idx)=>{
                let cls='quiz-option border-2 border-slate-200 rounded-xl p-3 text-left text-sm text-slate-700';
                if (answered) {
                  if (idx===q.correct) cls+=' quiz-reveal';
                  else if (idx===selected&&idx!==q.correct) cls+=' quiz-wrong';
                }
                return (
                  <button key={idx} className={cls} onClick={()=>pick(idx)}>
                    <span className="font-bold mr-2 text-slate-400">{['A','B','C','D'][idx]}.</span>
                    {opt}
                    {answered&&idx===q.correct&&<span className="ml-2">✓</span>}
                    {answered&&idx===selected&&idx!==q.correct&&<span className="ml-2">✗</span>}
                  </button>
                );
              })}
            </div>
            {answered&&(
              <div className="mt-4 p-4 bg-blue-50 rounded-xl border border-blue-200 slide-in">
                <p className="text-sm font-semibold text-blue-800 mb-1">{selected===q.correct?'✅ Correct!':'❌ Not quite.'}</p>
                <p className="text-sm text-blue-700">{q.explanation}</p>
                <button onClick={next} className="mt-3 px-5 py-2 rounded-xl text-white font-bold text-sm" style={{backgroundColor:'#2B2D6B'}}>
                  {current+1<questions.length?'Next Question →':'See Results'}
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

      {id:'msp-culture',icon:'🤝',title:'MSP Culture',desc:'How to sell to MSPs effectively',time:'7 min',color:'#7c3aed'},
      {id:'spot-psa',icon:'🔍',title:'Spot a PSA',desc:'Identify PSA types from MSP websites',time:'6 min',color:'#0284c7'},
      {id:'competitive',icon:'⚔️',title:'Competitive Playbook',desc:'Talk tracks & objections for every competitor',time:'Reference',color:'#dc2626'},
      {id:'knowledge-base',icon:'📚',title:'Knowledge Base',desc:'Live GitBook: sales processes, playbooks & more',time:'Live',color:'#0891b2'},
    ];
    // ─── Home Screen ──────────────────────────────────────────────────────────
    function HomeScreen({ onSelect }) {
      return (
        <div className="space-y-6 slide-in">
          <div className="gradient-header rounded-2xl p-8 text-white" style={{borderRadius:'12px'}}>
            <div className="flex items-center gap-3 mb-4">
              <span style={{color:'#C5A338'}} className="font-semibold">Alternative Payments</span>
            </div>
            <h1 className="text-3xl font-black leading-tight mb-3">MSP Landscape<br/>Onboarding Guide</h1>
            <p style={{color:'rgba(255,255,255,0.8)'}} className="leading-relaxed max-w-lg">Everything you need to understand the MSP market, speak the language, and sell with confidence. Work through each module at your own pace.</p>
            <div className="mt-5 flex flex-wrap gap-3">
              <div className="rounded-lg px-4 py-2 text-sm font-semibold" style={{backgroundColor:'rgba(255,255,255,0.12)',borderRadius:'8px'}}>10 Modules</div>
              <div className="rounded-lg px-4 py-2 text-sm font-semibold" style={{backgroundColor:'rgba(255,255,255,0.12)',borderRadius:'8px'}}>Interactive visuals</div>
              <div className="rounded-lg px-4 py-2 text-sm font-semibold" style={{backgroundColor:'rgba(255,255,255,0.12)',borderRadius:'8px'}}>Quizzes included</div>
            </div>
          </div>
          <div className="grid md:grid-cols-2 gap-4">
            {MODULES.map(m=>(
              <button key={m.id} onClick={()=>onSelect(m.id)} className="module-card bg-white p-5 text-left" style={{border:'1px solid #E2E8F0',boxShadow:'var(--ap-shadow-flat)'}}>
                <div className="flex items-start gap-4">
                  <div className="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl flex-shrink-0" style={{backgroundColor:m.color+'20'}}>{m.icon}</div>
                  <div className="flex-1">
                    <p className="font-bold text-base" style={{color:'#2B2D42'}}>{m.title}</p>
                    <p className="text-sm mt-1 leading-snug" style={{color:'#94A3B8'}}>{m.desc}</p>
                    <p className="text-xs font-semibold mt-2" style={{color:m.color}}>{m.time} read</p>
                  </div>
                  <span className="text-slate-300 text-xl mt-1">→</span>
                </div>
              </button>
            ))}
          </div>
        </div>
      );
    }
    // ─── Main App ─────────────────────────────────────────────────────────────
    function App() {
      const [active, setActive] = useState('home');
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const current = MODULES.find(m=>m.id===active);
      return (
        <div className="min-h-screen flex flex-col" style={{backgroundColor:'#F8FAFC'}}>
          <nav className="sticky top-0 z-50 bg-white border-b shadow-sm" style={{borderColor:'#E2E8F0',boxShadow:'var(--ap-shadow-sticky)'}}>
            <div className="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <button onClick={()=>setSidebarOpen(!sidebarOpen)} className="md:hidden p-2 rounded-lg text-slate-500 hover:bg-slate-100">☰</button>
                <button onClick={()=>setActive('home')} className="flex items-center gap-3">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 40" style={{height:'28px'}}>
                    <text x="0" y="30" fontFamily="Inter, -apple-system, BlinkMacSystemFont, sans-serif" fontSize="24" fontWeight="700" fill="#2B2D42">alternative</text>
                    <text x="158" y="30" fontFamily="Inter, -apple-system, BlinkMacSystemFont, sans-serif" fontSize="24" fontWeight="400" fill="#2B2D42">payments</text>
                  </svg>
                  <span className="text-xs font-bold px-2 py-0.5 rounded-full hidden sm:block" style={{backgroundColor:'#F3EEFF',color:'#2B2D6B'}}>MSP Guide</span>
                </button>
                {active!=='home'&&current&&(
                  <>
                    <span className="text-slate-300 hidden sm:block">/</span>
                    <span className="text-slate-600 text-sm font-semibold hidden sm:block">{current.title}</span>
                  </>
                )}
              </div>
              <button onClick={()=>setActive('home')} className={`text-sm font-semibold px-4 py-1.5 rounded-lg transition-all ${active==='home'?'text-white':'text-slate-500 hover:text-slate-800'}`} style={active==='home'?{backgroundColor:'#2B2D6B'}:{}}>All Modules</button>
            </div>
          </nav>
          <div className="flex flex-1 max-w-7xl mx-auto w-full">
            <aside className={`${sidebarOpen?'block':'hidden'} md:block w-64 flex-shrink-0 bg-white`}
              style={{position:'sticky',top:'56px',height:'calc(100vh - 56px)',overflowY:'auto',borderRight:'1px solid #E2E8F0'}}>
              <div className="p-4">
                <button onClick={()=>{setActive('home');setSidebarOpen(false)}} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold transition-all mb-1 ${active==='home'?'nav-item-active':'text-slate-600 hover:bg-slate-100'}`}>
                  <span>🏠</span> Home
                </button>
                <div className="mt-2 mb-1 px-3">
                  <p className="text-xs font-bold text-slate-400 uppercase tracking-widest">Modules</p>
                </div>
                {MODULES.map(m=>(
                  <button key={m.id} onClick={()=>{setActive(m.id);setSidebarOpen(false)}} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold transition-all mb-0.5 ${active===m.id?'nav-item-active':'text-slate-600 hover:bg-slate-100'}`}>
                    <span>{m.icon}</span>
                    <span className="truncate">{m.title}</span>
                  </button>
                ))}
              </div>
            </aside>
            <main className="flex-1 p-4 md:p-6 overflow-x-hidden">
              {active==='home'
                ? <HomeScreen onSelect={(id)=>setActive(id)}/>
                : <ModuleContent moduleId={active}/>
              }
            </main>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
